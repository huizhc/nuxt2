name: Build and Push Image to Aliyun ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: crpi-jgku4manxs9rc8ub.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: kwusongxin/nuxt2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Push
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.SSH_PWD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: docker-compose.yml
          target: /var/www/nuxt2

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.SSH_PWD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ACR_USERNAME,ACR_PASSWORD
          script_stop: true
          script: |
            echo "$ACR_PASSWORD" | docker login ${{ env.REGISTRY }} --username "$ACR_USERNAME" --password-stdin
            cd /var/www/nuxt2
            export TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --wait --wait-timeout 120 --remove-orphans
