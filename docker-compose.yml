services:
  nuxt2:
    image: crpi-jgku4manxs9rc8ub.cn-hangzhou.personal.cr.aliyuncs.com/kwusongxin/nuxt2:${TAG:?TAG is required}
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
